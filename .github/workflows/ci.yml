name: CI Pipeline

"on":
  push:
    branches:
      - main
      - "feature/*"
  pull_request:
    branches:
      - main
      - "feature/*"

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and syntax compilation check
        run: |
          python -m compileall api src tests scripts

      - name: Fast test execution
        run: pytest -q -m "not slow"

      - name: Full test execution
        run: pytest -q
